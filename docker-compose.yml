services:
  redis:
    image: redis:8-alpine # Redis 8 (licença AGPLv3, open source) na variante alpine (imagem leve)
    container_name: redis-cache
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec


    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data # persiste o AOF entre reinícios do container
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
    name: app-network
